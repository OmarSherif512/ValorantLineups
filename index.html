<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lineup Vault</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap');

:root {
  --bg: #0B141B;
  --bg-elev: #101B24;
  --panel: #15222C;
  --panel-2: #1B2A35;
  --line: rgba(236, 232, 225, 0.09);
  --line-strong: rgba(236, 232, 225, 0.18);
  --red: #FF4655;
  --red-dim: #C7313D;
  --teal: #3BE1C4;
  --amber: #F2B705;
  --text: #ECE8E1;
  --text-dim: #8B98A3;
  --text-faint: #5C6773;
  --font-display: 'Rajdhani', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --cut: 12px;
  --cut-sm: 7px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

body.modal-open { overflow: hidden; }

::selection { background: var(--red); color: #fff; }

button, input, select {
  font-family: inherit;
  color: inherit;
}

:focus-visible {
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.topbar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 28px clamp(16px, 4vw, 40px) 20px;
  border-bottom: 1px solid var(--line);
}

.brand-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  color: var(--red);
  text-transform: uppercase;
  margin: 0 0 6px;
}

.brand-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(24px, 3.6vw, 34px);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  margin: 0;
  line-height: 1;
}

.brand-sub {
  color: var(--text-dim);
  font-size: 13px;
  margin: 8px 0 0;
  max-width: 46ch;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.btn {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  border: 1px solid var(--line-strong);
  background: var(--panel-2);
  color: var(--text);
  padding: 11px 20px;
  cursor: pointer;
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
}
.btn:hover { border-color: var(--text-dim); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }

.btn-primary {
  background: var(--red);
  border-color: var(--red);
  color: #fff;
}
.btn-primary:hover { background: #ff5a67; border-color: #ff5a67; }

.btn-danger {
  background: transparent;
  border-color: var(--red-dim);
  color: var(--red);
}
.btn-danger:hover { background: rgba(255, 70, 85, 0.08); }
.btn-danger.armed { background: var(--red); color: #fff; }

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  align-items: center;
  padding: 18px clamp(16px, 4vw, 40px) 0;
}

.search-input {
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 10px 14px;
  font-size: 14px;
  min-width: 220px;
  flex: 1 1 220px;
  clip-path: polygon(var(--cut-sm) 0, 100% 0, 100% calc(100% - var(--cut-sm)), calc(100% - var(--cut-sm)) 100%, 0 100%, 0 var(--cut-sm));
}
.search-input::placeholder { color: var(--text-faint); }

.chips {
  display: flex;
  gap: 8px;
}

.chip {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--text-dim);
  padding: 9px 14px;
  cursor: pointer;
  clip-path: polygon(var(--cut-sm) 0, 100% 0, 100% calc(100% - var(--cut-sm)), calc(100% - var(--cut-sm)) 100%, 0 100%, 0 var(--cut-sm));
  transition: border-color 0.15s, color 0.15s;
}
.chip:hover { border-color: var(--line-strong); color: var(--text); }
.chip.active { color: var(--text); border-color: var(--text-dim); }
.chip-easy.active { border-color: var(--teal); color: var(--teal); }
.chip-medium.active { border-color: var(--amber); color: var(--amber); }
.chip-hard.active { border-color: var(--red); color: var(--red); }

.map-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 18px clamp(16px, 4vw, 40px) 14px;
  scrollbar-width: thin;
}
.map-tabs::-webkit-scrollbar { height: 4px; }
.map-tabs::-webkit-scrollbar-thumb { background: var(--line-strong); }

.map-tab {
  flex-shrink: 0;
  display: flex;
  align-items: baseline;
  gap: 7px;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-faint);
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  padding: 6px 4px 10px;
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
}
.map-tab:hover { color: var(--text-dim); }
.map-tab.active { color: var(--text); border-color: var(--red); }
.map-tab-count {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-faint);
}
.map-tab.active .map-tab-count { color: var(--red); }

main.grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 18px;
  padding: 10px clamp(16px, 4vw, 40px) 48px;
}

.card {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line);
  cursor: pointer;
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  transition: transform 0.15s ease, border-color 0.15s ease;
  animation: cardIn 0.35s ease both;
}
.card:hover, .card:focus-visible { transform: translateY(-3px); border-color: var(--line-strong); }

@keyframes cardIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.corner {
  position: absolute;
  width: 16px;
  height: 16px;
  border: 2px solid transparent;
  opacity: 0;
  transition: opacity 0.18s ease, border-color 0.18s ease;
  pointer-events: none;
  z-index: 2;
}
.corner.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
.corner.tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
.corner.bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
.corner.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }
.card:hover .corner, .card:focus-visible .corner { opacity: 1; border-color: var(--red); }

.card-media {
  aspect-ratio: 16 / 10;
  background: var(--bg-elev);
  overflow: hidden;
}
.card-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-media-empty {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-faint);
  font-family: var(--font-mono);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.card-body { padding: 14px 16px 16px; }
.card-map {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 4px;
}
.card-name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 18px;
  line-height: 1.2;
  margin-bottom: 8px;
}
.card-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); }
.diff-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.card-duration {
  font-family: var(--font-mono);
  margin-left: auto;
  color: var(--text-faint);
}

#emptyState {
  display: none;
  flex-direction: column;
  align-items: flex-start;
  gap: 10px;
  padding: 60px clamp(16px, 4vw, 40px);
  color: var(--text-dim);
}
.empty-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  color: var(--text);
  text-transform: uppercase;
  letter-spacing: 0.02em;
}
.empty-sub { font-size: 14px; color: var(--text-dim); margin-bottom: 6px; }

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(5, 9, 12, 0.72);
  backdrop-filter: blur(3px);
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding: 5vh 16px;
  overflow-y: auto;
  z-index: 50;
}
.modal-backdrop.open { display: flex; }

.modal-panel {
  background: var(--panel);
  border: 1px solid var(--line-strong);
  width: 100%;
  max-width: 620px;
  padding: 28px clamp(20px, 4vw, 34px) 32px;
  clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
  position: relative;
  animation: modalIn 0.22s ease both;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.modal-close {
  position: absolute;
  top: 20px;
  right: 20px;
  background: none;
  border: none;
  color: var(--text-faint);
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  padding: 4px;
}
.modal-close:hover { color: var(--text); }

.detail-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
.detail-map {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 6px;
}
.detail-name { font-family: var(--font-display); font-weight: 700; font-size: 26px; text-transform: uppercase; margin: 0; letter-spacing: 0.01em; }
.detail-tags { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); flex-shrink: 0; padding-top: 6px; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.detail-slot { position: relative; }
.detail-slot img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; border: 1px solid var(--line); }
.detail-slot-empty {
  aspect-ratio: 4/3;
  border: 1px dashed var(--line);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-faint);
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
}
.detail-slot-label {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-top: 6px;
}
.detail-actions { margin-top: 24px; display: flex; justify-content: flex-end; }
.detail-loading { color: var(--text-dim); font-family: var(--font-mono); font-size: 13px; padding: 30px 0; }

.toasts {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 100;
  pointer-events: none;
}
.toast {
  background: var(--panel-2);
  border: 1px solid var(--line-strong);
  color: var(--text);
  font-size: 13px;
  padding: 10px 18px;
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.toast.show { opacity: 1; transform: translateY(0); }

@media (max-width: 560px) {
  .topbar { flex-direction: column; }
  .detail-header { flex-direction: column; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <p class="brand-eyebrow">// Agent Ability Reference</p>
      <h1 class="brand-title">Lineup Vault</h1>
      <p class="brand-sub">Save the setups you don't want to relearn every night — throw spot, path, and result, filed by map.</p>
    </div>
  </header>

  <div class="controls">
    <input class="search-input" id="searchInput" type="text" placeholder="Search lineups by name...">
    <div class="chips" id="difficultyChips"></div>
  </div>

  <nav class="map-tabs" id="mapTabs"></nav>

  <main class="grid" id="grid"></main>
  <div id="emptyState"></div>
</div>

<div class="modal-backdrop" id="detailModal">
  <div class="modal-panel">
    <button type="button" class="modal-close" id="closeDetailBtn" aria-label="Close">&times;</button>
    <div id="detailBody"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
const MAPS = ["Ascent","Bind","Haven","Split","Icebox","Breeze","Fracture","Pearl","Lotus","Sunset","Abyss","Corrode","Summit"];

const DIFFICULTY_META = {
  easy: { label: "Easy", color: "var(--teal)" },
  medium: { label: "Medium", color: "var(--amber)" },
  hard: { label: "Hard", color: "var(--red)" }
};

const SLOT_META = [
  { key: "position", label: "Position", hint: "Where you stand" },
  { key: "showcase", label: "Showcase", hint: "Throw angle / trajectory" },
  { key: "reference", label: "Reference", hint: "Wide map orientation" },
  { key: "result", label: "Result", hint: "Final effect on site" }
];

const state = {
  index: [],
  loading: true,
  activeMap: "All",
  activeDifficulty: "All",
  search: ""
};

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      if (k === "class") node.className = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else if (k.startsWith("on") && typeof attrs[k] === "function") node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    }
  }
  (children || []).forEach(c => {
    if (c === null || c === undefined) return;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return node;
}

function showToast(msg) {
  const container = document.getElementById("toasts");
  const toast = el("div", { class: "toast" }, [msg]);
  container.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add("show"));
  setTimeout(() => {
    toast.classList.remove("show");
    setTimeout(() => toast.remove(), 300);
  }, 2600);
}

function thumbFor(images) {
  if (!images) return null;
  return images.position || images.showcase || images.reference || images.result || null;
}

async function loadLineups() {
  const res = await fetch("data.json", { cache: "no-store" });
  if (!res.ok) throw new Error("data.json responded with " + res.status);
  const data = await res.json();
  if (!Array.isArray(data)) throw new Error("data.json should be a JSON array");
  return data.map(item => ({ ...item, thumb: thumbFor(item.images) }));
}

function filteredIndex() {
  return state.index.filter(item => {
    if (state.activeMap !== "All" && item.map !== state.activeMap) return false;
    if (state.activeDifficulty !== "All" && item.difficulty !== state.activeDifficulty) return false;
    if (state.search && !item.name.toLowerCase().includes(state.search.toLowerCase())) return false;
    return true;
  });
}

function renderMapTabs() {
  const wrap = document.getElementById("mapTabs");
  wrap.innerHTML = "";
  const tabs = ["All", ...MAPS];
  tabs.forEach(m => {
    const count = m === "All" ? state.index.length : state.index.filter(i => i.map === m).length;
    const tab = el("button", {
      class: "map-tab" + (state.activeMap === m ? " active" : ""),
      onclick: () => { state.activeMap = m; renderMapTabs(); renderGrid(); }
    }, [
      el("span", { class: "map-tab-name" }, [m]),
      el("span", { class: "map-tab-count" }, [String(count)])
    ]);
    wrap.appendChild(tab);
  });
}

function renderDifficultyChips() {
  const wrap = document.getElementById("difficultyChips");
  wrap.innerHTML = "";
  const opts = ["All", "easy", "medium", "hard"];
  opts.forEach(d => {
    const label = d === "All" ? "All" : DIFFICULTY_META[d].label;
    const chip = el("button", {
      class: "chip" + (state.activeDifficulty === d ? " active" : "") + (d !== "All" ? " chip-" + d : ""),
      onclick: () => { state.activeDifficulty = d; renderDifficultyChips(); renderGrid(); }
    }, [label]);
    wrap.appendChild(chip);
  });
}

function cardNode(item) {
  const diff = DIFFICULTY_META[item.difficulty] || DIFFICULTY_META.easy;
  const card = el("div", { class: "card", tabindex: "0", onclick: () => openDetail(item.id) }, [
    el("span", { class: "corner tl" }),
    el("span", { class: "corner tr" }),
    el("span", { class: "corner bl" }),
    el("span", { class: "corner br" }),
    el("div", { class: "card-media" }, [
      item.thumb
        ? el("img", { src: item.thumb, alt: "" })
        : el("div", { class: "card-media-empty" }, ["No image"])
    ]),
    el("div", { class: "card-body" }, [
      el("div", { class: "card-map" }, [item.map]),
      el("div", { class: "card-name" }, [item.name]),
      el("div", { class: "card-meta" }, [
        el("span", { class: "diff-dot", style: `background:${diff.color}` }),
        el("span", { class: "card-diff" }, [diff.label]),
        item.duration ? el("span", { class: "card-duration" }, [item.duration]) : null
      ])
    ])
  ]);
  card.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDetail(item.id); }
  });
  return card;
}

function renderGrid() {
  const grid = document.getElementById("grid");
  const empty = document.getElementById("emptyState");
  grid.innerHTML = "";

  if (state.loading) {
    grid.style.display = "none";
    empty.style.display = "flex";
    empty.innerHTML = "";
    empty.appendChild(el("div", { class: "empty-title" }, ["Loading your lineups"]));
    return;
  }

  const items = filteredIndex();
  if (items.length === 0) {
    grid.style.display = "none";
    empty.style.display = "flex";
    empty.innerHTML = "";
    const hasAny = state.index.length > 0;
    empty.appendChild(el("div", { class: "empty-title" }, [
      hasAny ? "Nothing matches this filter" : "No lineups yet"
    ]));
    empty.appendChild(el("div", { class: "empty-sub" }, [
      hasAny
        ? "Try a different map or difficulty."
        : "Add entries to data.json to start building the vault."
    ]));
    return;
  }

  grid.style.display = "grid";
  empty.style.display = "none";
  items
    .slice()
    .sort((a, b) => b.createdAt - a.createdAt)
    .forEach(item => grid.appendChild(cardNode(item)));
}

function openDetail(id) {
  const modal = document.getElementById("detailModal");
  const body = document.getElementById("detailBody");
  const detail = state.index.find(i => i.id === id);

  body.innerHTML = "";
  modal.classList.add("open");
  document.body.classList.add("modal-open");

  if (!detail) {
    body.appendChild(el("div", { class: "detail-loading" }, ["Couldn't find this lineup."]));
    return;
  }

  const diff = DIFFICULTY_META[detail.difficulty] || DIFFICULTY_META.easy;
  body.appendChild(el("div", { class: "detail-header" }, [
    el("div", {}, [
      el("div", { class: "detail-map" }, [detail.map]),
      el("h2", { class: "detail-name" }, [detail.name])
    ]),
    el("div", { class: "detail-tags" }, [
      el("span", { class: "diff-dot", style: `background:${diff.color}` }),
      el("span", { class: "card-diff" }, [diff.label]),
      detail.duration ? el("span", { class: "card-duration" }, [detail.duration]) : null
    ])
  ]));

  const imgGrid = el("div", { class: "detail-grid" }, []);
  SLOT_META.forEach(s => {
    const src = detail.images ? detail.images[s.key] : null;
    imgGrid.appendChild(el("div", { class: "detail-slot" }, [
      src
        ? el("img", { src, alt: s.label })
        : el("div", { class: "detail-slot-empty" }, ["No image"]),
      el("div", { class: "detail-slot-label" }, [s.label])
    ]));
  });
  body.appendChild(imgGrid);
}

function closeDetail() {
  document.getElementById("detailModal").classList.remove("open");
  document.body.classList.remove("modal-open");
}

function wireStaticEvents() {
  document.getElementById("closeDetailBtn").addEventListener("click", closeDetail);
  document.getElementById("detailModal").addEventListener("click", e => { if (e.target.id === "detailModal") closeDetail(); });
  document.getElementById("searchInput").addEventListener("input", e => { state.search = e.target.value; renderGrid(); });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeDetail();
  });
}

async function init() {
  wireStaticEvents();
  renderDifficultyChips();
  renderMapTabs();
  renderGrid();

  try {
    state.index = await loadLineups();
  } catch (e) {
    state.index = [];
    showToast("Couldn't load data.json — serve this folder over http, don't open the file directly.");
  }

  state.loading = false;
  renderMapTabs();
  renderGrid();
}

init();

</script>
</body>
</html>
