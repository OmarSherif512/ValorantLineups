<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lineup Vault</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap');

:root {
  --bg: #0B141B;
  --bg-elev: #101B24;
  --panel: #15222C;
  --panel-2: #1B2A35;
  --line: rgba(236, 232, 225, 0.09);
  --line-strong: rgba(236, 232, 225, 0.18);
  --red: #FF4655;
  --red-dim: #C7313D;
  --teal: #3BE1C4;
  --amber: #F2B705;
  --text: #ECE8E1;
  --text-dim: #8B98A3;
  --text-faint: #5C6773;
  --font-display: 'Rajdhani', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --cut: 12px;
  --cut-sm: 7px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
}

body.modal-open { overflow: hidden; }

::selection { background: var(--red); color: #fff; }

button, input, select {
  font-family: inherit;
  color: inherit;
}

* {
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 70, 85, 0.8) rgba(17, 20, 27, 0.7);
}

*::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}

*::-webkit-scrollbar-track {
  background: rgba(17, 20, 27, 0.7);
}

*::-webkit-scrollbar-thumb {
  background: linear-gradient(180deg, rgba(255, 70, 85, 0.9), rgba(90, 164, 255, 0.8));
  border-radius: 999px;
  border: 2px solid rgba(17, 20, 27, 0.9);
}

:focus-visible {
  outline: 2px solid var(--teal);
  outline-offset: 2px;
}

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.topbar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 28px clamp(16px, 4vw, 40px) 20px;
  border-bottom: 1px solid var(--line);
}

.brand-eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  color: var(--red);
  text-transform: uppercase;
  margin: 0 0 6px;
}

.brand-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(24px, 3.6vw, 34px);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  margin: 0;
  line-height: 1;
}

.brand-sub {
  color: var(--text-dim);
  font-size: 13px;
  margin: 8px 0 0;
  max-width: 46ch;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.link-btn {
  background: none;
  border: none;
  color: var(--text-faint);
  font-size: 12px;
  cursor: pointer;
  padding: 4px 2px;
  text-decoration: underline;
  text-underline-offset: 3px;
  transition: color 0.15s;
}
.link-btn:hover { color: var(--text-dim); }
.link-btn.armed { color: var(--red); }

.btn {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  border: 1px solid var(--line-strong);
  background: var(--panel-2);
  color: var(--text);
  padding: 11px 20px;
  cursor: pointer;
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
}
.btn:hover { border-color: var(--text-dim); transform: translateY(-1px); }
.btn:active { transform: translateY(0); }

.btn-primary {
  background: var(--red);
  border-color: var(--red);
  color: #fff;
}
.btn-primary:hover { background: #ff5a67; border-color: #ff5a67; }

.btn-danger {
  background: transparent;
  border-color: var(--red-dim);
  color: var(--red);
}
.btn-danger:hover { background: rgba(255, 70, 85, 0.08); }
.btn-danger.armed { background: var(--red); color: #fff; }

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  align-items: center;
  padding: 18px clamp(16px, 4vw, 40px) 0;
}

.search-input {
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 10px 14px;
  font-size: 14px;
  min-width: 220px;
  flex: 1 1 220px;
  clip-path: polygon(var(--cut-sm) 0, 100% 0, 100% calc(100% - var(--cut-sm)), calc(100% - var(--cut-sm)) 100%, 0 100%, 0 var(--cut-sm));
}
.search-input::placeholder { color: var(--text-faint); }

.filter-selects {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.filter-select {
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 10px 12px;
  font-size: 13px;
  min-width: 140px;
  clip-path: polygon(var(--cut-sm) 0, 100% 0, 100% calc(100% - var(--cut-sm)), calc(100% - var(--cut-sm)) 100%, 0 100%, 0 var(--cut-sm));
}

.agent-dropdown {
  position: relative;
  min-width: 180px;
}

.agent-trigger {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 10px 12px;
  font-size: 13px;
  text-align: left;
  cursor: pointer;
  clip-path: polygon(var(--cut-sm) 0, 100% 0, 100% calc(100% - var(--cut-sm)), calc(100% - var(--cut-sm)) 100%, 0 100%, 0 var(--cut-sm));
}

.agent-trigger-icon {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  overflow: hidden;
  border: 1px solid var(--line-strong);
  background: rgba(255, 255, 255, 0.04);
  flex-shrink: 0;
}

.agent-trigger-icon img,
.agent-option-icon img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.agent-dropdown-menu {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  right: 0;
  display: none;
  max-height: 230px;
  overflow-y: auto;
  background: var(--bg-elev);
  border: 1px solid var(--line-strong);
  box-shadow: 0 18px 26px rgba(0, 0, 0, 0.28);
  z-index: 25;
}

.agent-dropdown.open .agent-dropdown-menu {
  display: block;
}

.agent-option {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  background: transparent;
  border: none;
  color: var(--text);
  text-align: left;
  cursor: pointer;
}

.agent-option:hover,
.agent-option.active {
  background: rgba(255, 255, 255, 0.04);
}

.agent-option-icon {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--line-strong);
  flex-shrink: 0;
}

.chips {
  display: flex;
  gap: 8px;
}

.chip {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--text-dim);
  padding: 9px 14px;
  cursor: pointer;
  clip-path: polygon(var(--cut-sm) 0, 100% 0, 100% calc(100% - var(--cut-sm)), calc(100% - var(--cut-sm)) 100%, 0 100%, 0 var(--cut-sm));
  transition: border-color 0.15s, color 0.15s;
}
.chip:hover { border-color: var(--line-strong); color: var(--text); }
.chip.active { color: var(--text); border-color: var(--text-dim); }
.chip-easy.active { border-color: var(--teal); color: var(--teal); }
.chip-medium.active { border-color: var(--amber); color: var(--amber); }
.chip-hard.active { border-color: var(--red); color: var(--red); }

.map-tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 18px clamp(16px, 4vw, 40px) 14px;
  scrollbar-width: thin;
}
.map-tabs::-webkit-scrollbar { height: 4px; }
.map-tabs::-webkit-scrollbar-thumb { background: var(--line-strong); }

.map-tab {
  flex-shrink: 0;
  display: flex;
  align-items: baseline;
  gap: 7px;
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  color: var(--text-faint);
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 14px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  padding: 6px 4px 10px;
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.15s, border-color 0.15s;
}
.map-tab:hover { color: var(--text-dim); }
.map-tab.active { color: var(--text); border-color: var(--red); }
.map-tab-count {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-faint);
}
.map-tab.active .map-tab-count { color: var(--red); }

.drafts-panel {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding: 12px clamp(16px, 4vw, 40px);
  border-top: 1px solid var(--line);
  background: var(--bg-elev);
  scrollbar-width: thin;
}
.drafts-panel::-webkit-scrollbar { height: 4px; }
.drafts-panel::-webkit-scrollbar-thumb { background: var(--line-strong); }

.draft-card {
  flex-shrink: 0;
  padding: 10px 14px;
  background: var(--panel);
  border: 2px solid var(--line);
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 8px;
}
.draft-card:hover { border-color: var(--text-dim); color: var(--text); }
.draft-card.active { border-color: var(--red); color: var(--red); background: rgba(255, 70, 85, 0.08); }
.draft-card-close { font-size: 16px; cursor: pointer; margin-left: 4px; }
.draft-card-close:hover { color: var(--red); }

.new-draft-btn {
  flex-shrink: 0;
  padding: 10px 14px;
  background: rgba(255, 70, 85, 0.15);
  border: 2px solid var(--red);
  border-radius: 4px;
  color: var(--red);
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
}
.new-draft-btn:hover { background: rgba(255, 70, 85, 0.25); }

main.grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 18px;
  padding: 10px clamp(16px, 4vw, 40px) 48px;
}

.card {
  position: relative;
  background: var(--panel);
  border: 1px solid var(--line);
  cursor: pointer;
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  transition: transform 0.15s ease, border-color 0.15s ease;
  animation: cardIn 0.35s ease both;
}
.card:hover, .card:focus-visible { transform: translateY(-3px); border-color: var(--line-strong); }

@keyframes cardIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.corner {
  position: absolute;
  width: 16px;
  height: 16px;
  border: 2px solid transparent;
  opacity: 0;
  transition: opacity 0.18s ease, border-color 0.18s ease;
  pointer-events: none;
  z-index: 2;
}
.corner.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
.corner.tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
.corner.bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
.corner.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }
.card:hover .corner, .card:focus-visible .corner { opacity: 1; border-color: var(--red); }

.card-media {
  aspect-ratio: 16 / 10;
  background: var(--bg-elev);
  overflow: hidden;
}
.card-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card-media-empty {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-faint);
  font-family: var(--font-mono);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.card-body { padding: 14px 16px 16px; }
.card-map {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 4px;
}
.card-name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 18px;
  line-height: 1.2;
  margin-bottom: 8px;
}
.card-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); }
.diff-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.card-duration {
  font-family: var(--font-mono);
  margin-left: auto;
  color: var(--text-faint);
}

#emptyState {
  display: none;
  flex-direction: column;
  align-items: flex-start;
  gap: 10px;
  padding: 60px clamp(16px, 4vw, 40px);
  color: var(--text-dim);
}
.empty-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 20px;
  color: var(--text);
  text-transform: uppercase;
  letter-spacing: 0.02em;
}
.empty-sub { font-size: 14px; color: var(--text-dim); margin-bottom: 6px; }

.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(5, 9, 12, 0.72);
  backdrop-filter: blur(3px);
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding: 5vh 16px;
  overflow-y: auto;
  z-index: 50;
}
.modal-backdrop.open { display: flex; }

.modal-panel {
  background: var(--panel);
  border: 1px solid var(--line-strong);
  width: 100%;
  max-width: 620px;
  padding: 28px clamp(20px, 4vw, 34px) 32px;
  clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
  position: relative;
  animation: modalIn 0.22s ease both;
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.modal-close {
  position: absolute;
  top: 20px;
  right: 20px;
  background: none;
  border: none;
  color: var(--text-faint);
  font-size: 22px;
  line-height: 1;
  cursor: pointer;
  padding: 4px;
}
.modal-close:hover { color: var(--text); }

.modal-title {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 22px;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  margin: 0 0 22px;
}

.field { margin-bottom: 18px; }
.field label {
  display: block;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-bottom: 7px;
}
.field input[type="text"], .field select {
  width: 100%;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 11px 13px;
  font-size: 14px;
  appearance: none;
}
.field select {
  background-image: linear-gradient(45deg, transparent 50%, var(--text-dim) 50%), linear-gradient(135deg, var(--text-dim) 50%, transparent 50%);
  background-position: calc(100% - 18px) center, calc(100% - 13px) center;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
}
.field-hint { font-size: 12px; color: var(--text-faint); margin-top: 6px; }
.field-row { display: flex; gap: 14px; }
.field-row .field { flex: 1; }

.diff-pills { display: flex; gap: 8px; }
.diff-pill {
  flex: 1;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  color: var(--text-dim);
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  padding: 10px 0;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s;
}
.diff-pill[data-value="easy"].active { border-color: var(--teal); color: var(--teal); }
.diff-pill[data-value="medium"].active { border-color: var(--amber); color: var(--amber); }
.diff-pill[data-value="hard"].active { border-color: var(--red); color: var(--red); }

.image-slots {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 8px;
}
.img-slot { display: flex; flex-direction: column; gap: 6px; }
.img-slot-frame {
  position: relative;
  display: block;
  aspect-ratio: 4 / 3;
  border: 1px dashed var(--line-strong);
  cursor: pointer;
  overflow: hidden;
  background: var(--bg-elev);
  transition: border-color 0.15s, background 0.15s;
}
.img-slot-frame.drag-over {
  border-color: var(--red);
  background: rgba(255, 70, 85, 0.08);
}
.img-slot.filled .img-slot-frame { border-style: solid; border-color: var(--line-strong); }
.img-slot-preview {
  position: absolute; inset: 0;
  background-size: cover;
  background-position: center;
  display: none;
}
.img-slot-placeholder {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 2px;
  text-align: center;
  padding: 8px;
}
.img-slot-plus { font-size: 20px; color: var(--text-faint); line-height: 1; }
.img-slot-label {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 13px;
  text-transform: uppercase;
  color: var(--text-dim);
}
.img-slot-hint { font-size: 10.5px; color: var(--text-faint); }
.img-slot-input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.img-slot-url-input {
  width: 100%;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 8px 10px;
  font-size: 12px;
  margin-top: 6px;
}
.img-slot-url-input::placeholder { color: var(--text-faint); }
.img-slot-clear {
  background: none;
  border: none;
  color: var(--text-faint);
  font-size: 11px;
  cursor: pointer;
  align-self: flex-end;
  text-decoration: underline;
  text-underline-offset: 2px;
}
.img-slot-clear:hover { color: var(--red); }

.form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; }

.detail-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 20px; }
.detail-map {
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 6px;
}
.detail-name { font-family: var(--font-display); font-weight: 700; font-size: 26px; text-transform: uppercase; margin: 0; letter-spacing: 0.01em; }
.detail-tags { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-dim); flex-shrink: 0; padding-top: 6px; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.detail-slot { position: relative; }
.detail-slot img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; border: 1px solid var(--line); }
.detail-slot-empty {
  aspect-ratio: 4/3;
  border: 1px dashed var(--line);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-faint);
  font-family: var(--font-mono);
  font-size: 11px;
  text-transform: uppercase;
}
.detail-slot-label {
  font-family: var(--font-mono);
  font-size: 10.5px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin-top: 6px;
}
.detail-actions { margin-top: 24px; display: flex; justify-content: flex-end; }
.detail-loading { color: var(--text-dim); font-family: var(--font-mono); font-size: 13px; padding: 30px 0; }

.gallery-modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(5, 9, 12, 0.95); backdrop-filter: blur(6px); z-index: 60; padding: 20px; }
.gallery-modal.open { display: flex; }
.gallery-container { position: relative; width: 100%; max-width: 90vw; max-height: 90vh; display: flex; align-items: center; justify-content: center; }
.gallery-image { max-width: 100%; max-height: 100%; object-fit: contain; border: 1px solid var(--line-strong); display: block; }
.gallery-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0, 0, 0, 0.5); color: var(--text); border: none; width: 44px; height: 44px; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
.gallery-nav:hover { background: rgba(0, 0, 0, 0.7); }
.gallery-nav.prev { left: 20px; }
.gallery-nav.next { right: 20px; }
.gallery-counter { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); background: rgba(0, 0, 0, 0.4); padding: 8px 16px; border-radius: 4px; }
.gallery-close { position: absolute; top: 20px; right: 20px; background: rgba(0, 0, 0, 0.5); border: none; color: var(--text); font-size: 28px; width: 40px; height: 40px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
.gallery-close:hover { background: rgba(0, 0, 0, 0.7); }

.toasts {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 100;
  pointer-events: none;
}
.toast {
  background: var(--panel-2);
  border: 1px solid var(--line-strong);
  color: var(--text);
  font-size: 13px;
  padding: 10px 18px;
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.toast.show { opacity: 1; transform: translateY(0); }

@media (max-width: 560px) {
  .topbar { flex-direction: column; }
  .detail-header { flex-direction: column; }
  .image-slots { grid-template-columns: 1fr 1fr; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <p class="brand-eyebrow">// Agent Ability Reference</p>
      <h1 class="brand-title">Lineup Vault</h1>
      <p class="brand-sub">Save the setups you don't want to relearn every night — throw spot, path, and result, filed by map.</p>
    </div>
    <div class="topbar-actions">
      <button class="link-btn" id="clearAllBtn">Clear all data</button>
      <button class="btn btn-primary" id="addBtn">+ New lineup</button>
    </div>
  </header>

  <div class="controls">
    <input class="search-input" id="searchInput" type="text" placeholder="Search lineups by name...">
    <div class="chips" id="difficultyChips"></div>
    <div class="filter-selects">
      <div class="agent-dropdown" id="agentFilterWrap">
        <button type="button" class="agent-trigger" id="agentFilterBtn">
          <span class="agent-trigger-icon" id="agentFilterIcon"></span>
          <span id="agentFilterLabel">All agents</span>
        </button>
        <div class="agent-dropdown-menu" id="agentFilterMenu"></div>
      </div>
      <select class="filter-select" id="siteFilter">
        <option value="All">All sites</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
      </select>
    </div>
  </div>

  <nav class="map-tabs" id="mapTabs"></nav>

  <div class="drafts-panel" id="draftsPanelContainer">
    <button class="new-draft-btn" id="newDraftBtn">+ NEW DRAFT</button>
    <div id="draftsList" style="display: flex; gap: 6px; flex: 1; overflow-x: auto;"></div>
  </div>

  <main class="grid" id="grid"></main>
  <div id="emptyState"></div>
</div>

<div class="modal-backdrop" id="formModal">
  <div class="modal-panel">
    <button type="button" class="modal-close" id="closeFormBtn" aria-label="Close">&times;</button>
    <h2 class="modal-title">New Lineup</h2>
    <form id="lineupForm">
      <div class="field">
        <label for="nameInput">Lineup name</label>
        <input type="text" id="nameInput" placeholder="e.g. A Site Window Molly" autocomplete="off">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="mapSelect">Map</label>
          <select id="mapSelect"></select>
        </div>
        <div class="field">
          <label for="durationInput">Duration</label>
          <input type="text" id="durationInput" placeholder="e.g. 1.2s throw, 15s smoke" autocomplete="off">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Agent</label>
          <div class="agent-dropdown" id="agentSelectWrap">
            <button type="button" class="agent-trigger" id="agentSelectBtn">
              <span class="agent-trigger-icon" id="agentSelectIcon"></span>
              <span id="agentSelectLabel">Choose an agent</span>
            </button>
            <div class="agent-dropdown-menu" id="agentSelectMenu"></div>
          </div>
          <input type="hidden" id="agentSelectValue" value="">
        </div>
        <div class="field">
          <label for="siteSelect">Site</label>
          <select id="siteSelect">
            <option value="">Choose a site</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Difficulty</label>
        <div class="diff-pills">
          <button type="button" class="diff-pill" data-value="easy">Easy</button>
          <button type="button" class="diff-pill" data-value="medium">Medium</button>
          <button type="button" class="diff-pill" data-value="hard">Hard</button>
        </div>
        <input type="hidden" id="difficultyValue" value="easy">
      </div>
      <div class="field">
        <label>Images</label>
        <div class="image-slots" id="imageSlots"></div>
        <p class="field-hint">All four are optional, but position + result make it findable later.</p>
      </div>
      <div class="form-actions">
        <button type="button" class="btn" id="cancelFormBtn" onclick="document.getElementById('closeFormBtn').click()">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveBtn">Save lineup</button>
      </div>
    </form>
  </div>
</div>

<div class="modal-backdrop" id="detailModal">
  <div class="modal-panel">
    <button type="button" class="modal-close" id="closeDetailBtn" aria-label="Close">&times;</button>
    <div id="detailBody"></div>
  </div>
</div>

<div class="gallery-modal" id="galleryModal">
  <button type="button" class="gallery-close" id="closeGalleryBtn">&times;</button>
  <div class="gallery-container">
    <button type="button" class="gallery-nav prev" id="galleryPrev">‹</button>
    <img class="gallery-image" id="galleryImage" src="" alt="Gallery">
    <button type="button" class="gallery-nav next" id="galleryNext">›</button>
    <div class="gallery-counter" id="galleryCounter"></div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
const MAPS = ["Ascent","Bind","Haven","Split","Icebox","Breeze","Fracture","Pearl","Lotus","Sunset","Abyss","Corrode","Summit"];
const FALLBACK_AGENTS = ["Astra","Breach","Brimstone","Chamber","Cypher","Fade","Gekko","Harbor","Jett","KAY/O","Killjoy","Neon","Omen","Phoenix","Raze","Reyna","Sage","Skye","Sova","Viper","Yoru","Iso","Deadlock","Clove","Vyse"];
const AGENTS = [...FALLBACK_AGENTS];
const SITES = ["A","B","C"];
const AGENT_META = [];

const DIFFICULTY_META = {
  easy: { label: "Easy", color: "var(--teal)" },
  medium: { label: "Medium", color: "var(--amber)" },
  hard: { label: "Hard", color: "var(--red)" }
};

const SLOT_META = [
  { key: "position", label: "Position", hint: "Where you stand" },
  { key: "showcase", label: "Showcase", hint: "Throw angle / trajectory" },
  { key: "reference", label: "Reference", hint: "Wide map orientation" },
  { key: "result", label: "Result", hint: "Final effect on site" }
];

const state = {
  index: [],
  loading: true,
  activeMap: "All",
  activeDifficulty: "All",
  activeAgent: "All",
  activeSite: "All",
  formAgent: "",
  search: "",
  formImages: {},
  clearArmed: false,
  deleteArmed: false,
  galleryImages: [],
  galleryIndex: 0,
  drafts: [],
  currentDraftId: null
};

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const k in attrs) {
      if (k === "class") node.className = attrs[k];
      else if (k === "html") node.innerHTML = attrs[k];
      else if (k.startsWith("on") && typeof attrs[k] === "function") node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    }
  }
  (children || []).forEach(c => {
    if (c === null || c === undefined) return;
    node.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  });
  return node;
}

function loadDrafts() {
  try {
    const saved = sessionStorage.getItem("lineup_drafts");
    return saved ? JSON.parse(saved) : [];
  } catch (e) {
    return [];
  }
}

function saveDrafts() {
  try {
    sessionStorage.setItem("lineup_drafts", JSON.stringify(state.drafts));
  } catch (e) {
    console.error("Failed to save drafts:", e);
  }
}

function createDraft(name) {
  const draft = {
    id: "draft_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
    name: name || `Draft ${state.drafts.length + 1}`,
    map: "",
    agent: "",
    site: "",
    difficulty: "easy",
    duration: "",
    images: { position: null, showcase: null, reference: null, result: null },
    createdAt: Date.now()
  };
  state.drafts.push(draft);
  switchToDraft(draft.id);
  saveDrafts();
  renderDraftsPanel();
  return draft;
}

function switchToDraft(draftId) {
  state.currentDraftId = draftId;
  saveDrafts();
  renderDraftsPanel();
}

function getCurrentDraft() {
  return state.drafts.find(d => d.id === state.currentDraftId);
}

function updateCurrentDraft(data) {
  const draft = getCurrentDraft();
  if (draft) {
    Object.assign(draft, data);
    saveDrafts();
  }
}

function deleteDraft(draftId) {
  state.drafts = state.drafts.filter(d => d.id !== draftId);
  if (state.currentDraftId === draftId) {
    state.currentDraftId = state.drafts.length > 0 ? state.drafts[0].id : null;
  }
  saveDrafts();
  renderDraftsPanel();
}

async function finalizeDraft(draftId) {
  const draft = state.drafts.find(d => d.id === draftId);
  if (!draft || !draft.name) return;

  const entry = {
    id: genId(),
    name: draft.name,
    map: draft.map,
    agent: draft.agent || null,
    site: draft.site || null,
    difficulty: draft.difficulty,
    duration: draft.duration,
    images: draft.images,
    createdAt: Date.now()
  };
  entry.thumb = entry.images.result || entry.images.showcase || entry.images.reference || entry.images.position;

  const ok = await saveEntry(entry);
  if (ok) {
    state.index.push(entry);
    deleteDraft(draftId);
    showToast(`"${entry.name}" saved to vault!`);
    renderMapTabs();
    renderGrid();
  } else {
    showToast("Failed to save draft.");
  }
}

function renderDraftsPanel() {
  const draftsList = document.getElementById("draftsList");
  draftsList.innerHTML = "";

  state.drafts.forEach(draft => {
    const isActive = state.currentDraftId === draft.id;
    const card = el("div", {
      class: "draft-card" + (isActive ? " active" : ""),
      onclick: () => switchToDraft(draft.id)
    }, [
      el("span", {}, [draft.name.slice(0, 16) + (draft.name.length > 16 ? "..." : "")]),
      el("span", {
        class: "draft-card-close",
        onclick: (e) => {
          e.stopPropagation();
          const btn = e.target.closest(".draft-card").parentElement.querySelector("button");
          if (!btn.disabled) {
            btn.disabled = true;
            finalizeDraft(draft.id);
          }
        },
        title: "Save to vault"
      }, ["✓"])
    ]);
    draftsList.appendChild(card);
  });
}

function wireFormToDraft() {
  const form = document.getElementById("lineupForm");
  if (!form) return;

  form.addEventListener("change", () => {
    const draft = getCurrentDraft();
    if (!draft) return;

    updateCurrentDraft({
      name: document.getElementById("nameInput").value || draft.name,
      map: document.getElementById("mapSelect").value || draft.map,
      agent: document.getElementById("agentSelectValue").value || draft.agent,
      site: document.getElementById("siteSelect").value || draft.site,
      difficulty: document.getElementById("difficultyValue").value || draft.difficulty,
      duration: document.getElementById("durationInput").value || draft.duration
    });
  });
}

function genId() {
  return "ln_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

async function loadIndex() {
  try {
    const res = await fetch("/api/data", { cache: "no-store" });
    if (!res.ok) return [];
    const data = await res.json();
    return Array.isArray(data) ? data : [];
  } catch (e) {
    return [];
  }
}

function imageSourceFromValue(value) {
  if (!value) return "";

  try {
    const parsed = new URL(value);
    const isBlobUrl = parsed.hostname.includes("blob.vercel-storage.com") || parsed.hostname.includes("private.blob.vercel-storage.com");
    if (isBlobUrl) {
      const pathname = parsed.pathname.replace(/^\/+/, "");
      return `/api/view?pathname=${encodeURIComponent(pathname)}`;
    }
  } catch (e) {
    // fall through for non-URL values
  }

  if (/^https?:\/\//i.test(value)) return value;
  return `/api/view?pathname=${encodeURIComponent(value)}`;
}

async function uploadImage(id, slot, dataUrl) {
  const res = await fetch("/api/upload", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id, slot, dataUrl })
  });

  const body = await res.json().catch(() => ({}));
  if (!res.ok) {
    throw new Error(body.message || body.error || "upload failed");
  }

  return body.pathname || body.url;
}

async function saveEntry(entry) {
  const res = await fetch("/api/save", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(entry)
  });
  return res.ok;
}

async function deleteEntry(id) {
  const res = await fetch("/api/delete", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id })
  });
  return res.ok;
}

async function clearEntries() {
  const res = await fetch("/api/clear", { method: "POST" });
  return res.ok;
}

function resizeFileToDataUrl(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("read failed"));
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => reject(new Error("decode failed"));
      img.onload = () => {
        let w = img.width;
        let h = img.height;
        if (w > h) {
          if (w > maxDim) { h = Math.round(h * (maxDim / w)); w = maxDim; }
        } else {
          if (h > maxDim) { w = Math.round(w * (maxDim / h)); h = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function showToast(msg) {
  const container = document.getElementById("toasts");
  const toast = el("div", { class: "toast" }, [msg]);
  container.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add("show"));
  setTimeout(() => {
    toast.classList.remove("show");
    setTimeout(() => toast.remove(), 300);
  }, 2600);
}

function filteredIndex() {
  return state.index.filter(item => {
    if (state.activeMap !== "All" && item.map !== state.activeMap) return false;
    if (state.activeDifficulty !== "All" && item.difficulty !== state.activeDifficulty) return false;
    if (state.activeAgent !== "All" && (item.agent || "") !== state.activeAgent) return false;
    if (state.activeSite !== "All" && (item.site || "") !== state.activeSite) return false;
    if (state.search && !item.name.toLowerCase().includes(state.search.toLowerCase())) return false;
    return true;
  });
}

function renderMapTabs() {
  const wrap = document.getElementById("mapTabs");
  wrap.innerHTML = "";
  const tabs = ["All", ...MAPS];
  tabs.forEach(m => {
    const count = m === "All" ? state.index.length : state.index.filter(i => i.map === m).length;
    const tab = el("button", {
      class: "map-tab" + (state.activeMap === m ? " active" : ""),
      onclick: () => { state.activeMap = m; renderMapTabs(); renderGrid(); }
    }, [
      el("span", { class: "map-tab-name" }, [m]),
      el("span", { class: "map-tab-count" }, [String(count)])
    ]);
    wrap.appendChild(tab);
  });
}

function renderDifficultyChips() {
  const wrap = document.getElementById("difficultyChips");
  wrap.innerHTML = "";
  const opts = ["All", "easy", "medium", "hard"];
  opts.forEach(d => {
    const label = d === "All" ? "All" : DIFFICULTY_META[d].label;
    const chip = el("button", {
      class: "chip" + (state.activeDifficulty === d ? " active" : "") + (d !== "All" ? " chip-" + d : ""),
      onclick: () => { state.activeDifficulty = d; renderDifficultyChips(); renderGrid(); }
    }, [label]);
    wrap.appendChild(chip);
  });
}

function getAgentMeta(agentName) {
  if (!agentName) return null;
  return AGENT_META.find(agent => agent.name === agentName) || null;
}

function agentIconHtml(agentName, sizeClass = "") {
  const meta = getAgentMeta(agentName);
  if (!meta || !meta.icon) {
    return `<span class="agent-option-icon" style="display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:10px;${sizeClass}">${agentName ? agentName.slice(0, 1).toUpperCase() : "?"}</span>`;
  }
  return `<span class="agent-option-icon"><img src="${meta.icon}" alt="${agentName}"></span>`;
}

function renderAgentMenu(menuId, selectedValue, mode) {
  const menu = document.getElementById(menuId);
  menu.innerHTML = "";
  const choices = mode === "filter"
    ? [{ value: "All", label: "All agents", icon: "" }, ...AGENTS.map(name => ({ value: name, label: name, icon: getAgentMeta(name)?.icon || "" }))]
    : [{ value: "", label: "Choose an agent", icon: "" }, ...AGENTS.map(name => ({ value: name, label: name, icon: getAgentMeta(name)?.icon || "" }))];

  choices.forEach(choice => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "agent-option" + (selectedValue === choice.value ? " active" : "");
    btn.innerHTML = `${choice.icon ? `<span class="agent-option-icon"><img src="${choice.icon}" alt="${choice.label}"></span>` : `<span class="agent-option-icon" style="display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:10px;">${choice.label === "All agents" ? "A" : choice.label ? choice.label.slice(0, 1).toUpperCase() : "?"}</span>`}<span>${choice.label}</span>`;
    btn.addEventListener("click", () => {
      if (mode === "filter") {
        state.activeAgent = choice.value || "All";
        renderGrid();
        updateAgentFilterDisplay();
      } else {
        state.formAgent = choice.value || "";
        document.getElementById("agentSelectValue").value = state.formAgent;
        updateAgentSelectDisplay();
      }
      closeAgentMenus();
    });
    menu.appendChild(btn);
  });
}

function updateAgentFilterDisplay() {
  const btn = document.getElementById("agentFilterBtn");
  const icon = document.getElementById("agentFilterIcon");
  const label = document.getElementById("agentFilterLabel");
  const meta = getAgentMeta(state.activeAgent);
  const activeLabel = state.activeAgent === "All" ? "All agents" : state.activeAgent;
  icon.innerHTML = meta && meta.icon ? `<img src="${meta.icon}" alt="${activeLabel}">` : `<span style="font-size:10px;color:var(--text-dim);">${activeLabel ? activeLabel.slice(0, 1).toUpperCase() : "A"}</span>`;
  label.textContent = activeLabel;
  btn.title = activeLabel;
}

function updateAgentSelectDisplay() {
  const btn = document.getElementById("agentSelectBtn");
  const icon = document.getElementById("agentSelectIcon");
  const label = document.getElementById("agentSelectLabel");
  const value = state.formAgent || "";
  const meta = getAgentMeta(value);
  icon.innerHTML = meta && meta.icon ? `<img src="${meta.icon}" alt="${value}">` : `<span style="font-size:10px;color:var(--text-dim);">${value ? value.slice(0, 1).toUpperCase() : "?"}</span>`;
  label.textContent = value || "Choose an agent";
  btn.title = value || "Choose an agent";
}

function closeAgentMenus() {
  document.getElementById("agentFilterWrap").classList.remove("open");
  document.getElementById("agentSelectWrap").classList.remove("open");
}

function bindAgentDropdowns() {
  document.getElementById("agentFilterBtn").addEventListener("click", e => {
    e.stopPropagation();
    const wrap = document.getElementById("agentFilterWrap");
    const other = document.getElementById("agentSelectWrap");
    wrap.classList.toggle("open");
    other.classList.remove("open");
  });

  document.getElementById("agentSelectBtn").addEventListener("click", e => {
    e.stopPropagation();
    const wrap = document.getElementById("agentSelectWrap");
    const other = document.getElementById("agentFilterWrap");
    wrap.classList.toggle("open");
    other.classList.remove("open");
  });

  document.addEventListener("click", () => closeAgentMenus());
}

function buildFilterOptions() {
  renderAgentMenu("agentFilterMenu", state.activeAgent, "filter");
  updateAgentFilterDisplay();

  const siteFilter = document.getElementById("siteFilter");
  siteFilter.innerHTML = "<option value=\"All\">All sites</option><option value=\"A\">A</option><option value=\"B\">B</option><option value=\"C\">C</option>";
  siteFilter.value = state.activeSite;
}

async function loadAgentData() {
  try {
    const res = await fetch("https://valorant-api.com/v1/agents?isPlayableCharacter=true");
    if (!res.ok) throw new Error("agent fetch failed");
    const json = await res.json();
    const agents = (json.data || []).filter(agent => typeof agent.displayName === "string" && agent.displayIcon);
    if (agents.length) {
      AGENT_META.splice(0, AGENT_META.length, ...agents.map(agent => ({ name: agent.displayName, icon: agent.displayIcon })));
      AGENTS.splice(0, AGENTS.length, ...agents.map(agent => agent.displayName));
    }
  } catch (e) {
    AGENT_META.splice(0, AGENT_META.length, ...FALLBACK_AGENTS.map(name => ({ name, icon: "" })));
  }
}

function cardNode(item) {
  const diff = DIFFICULTY_META[item.difficulty] || DIFFICULTY_META.easy;
  const agentMeta = getAgentMeta(item.agent);
  const card = el("div", { class: "card", tabindex: "0", onclick: () => openDetail(item.id) }, [
    el("span", { class: "corner tl" }),
    el("span", { class: "corner tr" }),
    el("span", { class: "corner bl" }),
    el("span", { class: "corner br" }),
    el("div", { class: "card-media" }, [
      item.thumb
        ? el("img", { src: imageSourceFromValue(item.thumb), alt: "" })
        : el("div", { class: "card-media-empty" }, ["No image"])
    ]),
    el("div", { class: "card-body" }, [
      el("div", { class: "card-map" }, [item.map]),
      el("div", { class: "card-name" }, [item.name]),
      el("div", { class: "card-meta" }, [
        el("span", { class: "diff-dot", style: `background:${diff.color}` }),
        el("span", { class: "card-diff" }, [diff.label]),
        agentMeta && agentMeta.icon
          ? el("span", { style: "display:inline-flex;align-items:center;gap:6px;" }, [
              el("img", { src: agentMeta.icon, alt: item.agent, style: "width:18px;height:18px;border-radius:50%;object-fit:cover;display:block;" }),
              el("span", {}, [item.agent])
            ])
          : (item.agent ? el("span", {}, [item.agent]) : null),
        item.duration ? el("span", { class: "card-duration" }, [item.duration]) : null
      ])
    ])
  ]);
  card.addEventListener("keydown", e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDetail(item.id); }
  });
  return card;
}

function renderGrid() {
  const grid = document.getElementById("grid");
  const empty = document.getElementById("emptyState");
  grid.innerHTML = "";

  if (state.loading) {
    grid.style.display = "none";
    empty.style.display = "flex";
    empty.innerHTML = "";
    empty.appendChild(el("div", { class: "empty-title" }, ["Loading your lineups"]));
    return;
  }

  const items = filteredIndex();
  if (items.length === 0) {
    grid.style.display = "none";
    empty.style.display = "flex";
    empty.innerHTML = "";
    const hasAny = state.index.length > 0;
    empty.appendChild(el("div", { class: "empty-title" }, [
      hasAny ? "Nothing matches this filter" : "No lineups saved yet"
    ]));
    empty.appendChild(el("div", { class: "empty-sub" }, [
      hasAny
        ? "Try a different map or difficulty."
        : (state.activeMap === "All" ? "Add your first lineup to start building the vault." : `Add the first ${state.activeMap} lineup.`)
    ]));
    if (!hasAny || state.activeMap !== "All") {
      empty.appendChild(el("button", { class: "btn btn-primary", onclick: () => openForm(state.activeMap === "All" ? null : state.activeMap) }, ["+ New lineup"]));
    }
    return;
  }

  grid.style.display = "grid";
  empty.style.display = "none";
  items
    .slice()
    .sort((a, b) => b.createdAt - a.createdAt)
    .forEach(item => grid.appendChild(cardNode(item)));
}

function resetFormImages() {
  state.formImages = {};
  SLOT_META.forEach(s => setSlotPreview(s.key, null));
}

function setSlotPreview(key, dataUrl) {
  const slot = document.querySelector(`.img-slot[data-key="${key}"]`);
  if (!slot) return;
  const preview = slot.querySelector(".img-slot-preview");
  const placeholder = slot.querySelector(".img-slot-placeholder");
  if (dataUrl) {
    preview.style.backgroundImage = `url(${dataUrl})`;
    preview.style.display = "block";
    placeholder.style.display = "none";
    slot.classList.add("filled");
  } else {
    preview.style.backgroundImage = "";
    preview.style.display = "none";
    placeholder.style.display = "flex";
    slot.classList.remove("filled");
  }
}

async function handleSlotFile(key, file) {
  if (!file) return;
  const dataUrl = await resizeFileToDataUrl(file, 1100, 0.74);
  state.formImages[key] = dataUrl;
  setSlotPreview(key, dataUrl);
  const urlInput = document.querySelector(`.img-slot[data-key="${key}"] .img-slot-url-input`);
  if (urlInput) urlInput.value = "";
}

async function handleSlotUrl(key, urlValue) {
  if (!urlValue || !urlValue.trim()) {
    delete state.formImages[key];
    setSlotPreview(key, null);
    return;
  }

  try {
    const response = await fetch(urlValue.trim(), { mode: "cors" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);

    const blob = await response.blob();
    if (!blob.type.startsWith("image/")) throw new Error("Not an image");

    const file = new File([blob], "image.jpg", { type: blob.type });
    await handleSlotFile(key, file);
  } catch (e) {
    showToast(`Failed to load image: ${e.message}`);
    const urlInput = document.querySelector(`.img-slot[data-key="${key}"] .img-slot-url-input`);
    if (urlInput) urlInput.value = "";
  }
}

async function handleUrlInputPaste(key, event) {
  const clipboardItems = event.clipboardData?.items;
  if (!clipboardItems) return;
  for (const item of clipboardItems) {
    if (item.kind === "file" && item.type.startsWith("image/")) {
      event.preventDefault();
      const blob = item.getAsFile();
      if (blob) {
        const file = new File([blob], "pasted.jpg", { type: blob.type });
        await handleSlotFile(key, file);
      }
      return;
    }
  }
}

function setupSlotDragDrop(slot, key, input) {
  const frame = slot.querySelector(".img-slot-frame");
  
  ["dragenter", "dragover", "dragleave", "drop"].forEach(eventName => {
    frame.addEventListener(eventName, e => e.preventDefault(), false);
  });

  frame.addEventListener("dragenter", () => frame.classList.add("drag-over"));
  frame.addEventListener("dragleave", (e) => {
    if (e.target === frame) frame.classList.remove("drag-over");
  });

  frame.addEventListener("drop", (e) => {
    frame.classList.remove("drag-over");
    const files = e.dataTransfer?.files;
    if (files && files.length) {
      const file = Array.from(files).find(f => f.type.startsWith("image/"));
      if (file) handleSlotFile(key, file);
    }
  });
}

function buildImageSlots() {
  const wrap = document.getElementById("imageSlots");
  wrap.innerHTML = "";
  SLOT_META.forEach(s => {
    const inputId = "file-" + s.key;
    const urlInputId = "url-" + s.key;
    const input = el("input", {
      type: "file",
      accept: "image/*",
      id: inputId,
      class: "img-slot-input",
      onchange: e => handleSlotFile(s.key, e.target.files[0])
    });
    const urlInput = el("input", {
      type: "text",
      id: urlInputId,
      class: "img-slot-url-input",
      placeholder: "Or paste image URL or Ctrl+V to paste copied image...",
      onchange: e => handleSlotUrl(s.key, e.target.value),
      onkeydown: e => {
        if (e.key === "Enter") {
          e.preventDefault();
          handleSlotUrl(s.key, e.target.value);
        }
      },
      onpaste: e => handleUrlInputPaste(s.key, e)
    });
    const slot = el("div", { class: "img-slot", "data-key": s.key }, [
      el("label", { class: "img-slot-frame", for: inputId }, [
        el("div", { class: "img-slot-preview" }),
        el("div", { class: "img-slot-placeholder" }, [
          el("span", { class: "img-slot-plus" }, ["+"]),
          el("span", { class: "img-slot-label" }, [s.label]),
          el("span", { class: "img-slot-hint" }, [s.hint])
        ])
      ]),
      input,
      urlInput,
      el("button", {
        type: "button",
        class: "img-slot-clear",
        onclick: () => {
          delete state.formImages[s.key];
          input.value = "";
          urlInput.value = "";
          setSlotPreview(s.key, null);
        }
      }, ["Remove"])
    ]);
    setupSlotDragDrop(slot, s.key, input);
    wrap.appendChild(slot);
  });
}

function buildMapOptions(select) {
  select.innerHTML = "";
  select.appendChild(el("option", { value: "" }, ["Choose a map"]));
  MAPS.forEach(m => select.appendChild(el("option", { value: m }, [m])));
}

function setActiveDifficultyPill(value) {
  document.querySelectorAll(".diff-pill").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.value === value);
  });
  document.getElementById("difficultyValue").value = value;
}

function openForm(presetMap) {
  const modal = document.getElementById("formModal");
  document.getElementById("lineupForm").reset();
  state.formAgent = "";
  document.getElementById("agentSelectValue").value = "";
  resetFormImages();
  buildMapOptions(document.getElementById("mapSelect"));
  document.getElementById("siteSelect").value = "";
  updateAgentSelectDisplay();

  const draft = getCurrentDraft();
  if (draft) {
    document.getElementById("nameInput").value = draft.name || "";
    document.getElementById("mapSelect").value = draft.map || "";
    document.getElementById("durationInput").value = draft.duration || "";
    document.getElementById("siteSelect").value = draft.site || "";
    state.formAgent = draft.agent || "";
    document.getElementById("agentSelectValue").value = state.formAgent;
    updateAgentSelectDisplay();
    setActiveDifficultyPill(draft.difficulty || "easy");
    Object.entries(draft.images).forEach(([key, src]) => {
      if (src) setSlotPreview(key, src);
    });
  } else {
    if (presetMap) document.getElementById("mapSelect").value = presetMap;
    setActiveDifficultyPill("easy");
  }

  modal.classList.add("open");
  document.body.classList.add("modal-open");
  setTimeout(() => document.getElementById("nameInput").focus(), 50);
}

function closeForm() {
  document.getElementById("formModal").classList.remove("open");
  document.body.classList.remove("modal-open");
}

async function submitForm(e) {
  e.preventDefault();
  const name = document.getElementById("nameInput").value.trim();
  const map = document.getElementById("mapSelect").value;
  const agent = document.getElementById("agentSelectValue").value || "";
  const site = document.getElementById("siteSelect").value;
  const duration = document.getElementById("durationInput").value.trim();
  const difficulty = document.getElementById("difficultyValue").value || "easy";

  if (!name || !map) {
    showToast("Name and map are required.");
    return;
  }

  const saveBtn = document.getElementById("saveBtn");
  saveBtn.disabled = true;
  saveBtn.textContent = "Uploading images...";

  const id = genId();
  const images = { position: null, showcase: null, reference: null, result: null };

  try {
    for (const key of Object.keys(images)) {
      const dataUrl = state.formImages[key];
      if (dataUrl) images[key] = await uploadImage(id, key, dataUrl);
    }
  } catch (e) {
    saveBtn.disabled = false;
    saveBtn.textContent = "Save lineup";
    showToast(e?.message || "Image upload failed. Try again.");
    return;
  }

  saveBtn.textContent = "Saving...";

  const entry = {
    id,
    name,
    map,
    agent: agent || null,
    site: site || null,
    difficulty,
    duration,
    images,
    createdAt: Date.now()
  };
  entry.thumb = images.result || images.showcase || images.reference || images.position;

  const ok = await saveEntry(entry);

  saveBtn.disabled = false;
  saveBtn.textContent = "Save lineup";

  if (!ok) {
    showToast("Couldn't save. Try again.");
    return;
  }

  state.index.push(entry);
  closeForm();
  renderMapTabs();
  renderGrid();
  showToast("Lineup saved.");
}

async function openDetail(id) {
  const modal = document.getElementById("detailModal");
  const body = document.getElementById("detailBody");
  body.innerHTML = "";
  modal.classList.add("open");
  document.body.classList.add("modal-open");
  state.deleteArmed = false;

  const detail = state.index.find(i => i.id === id);
  if (!detail) {
    body.appendChild(el("div", { class: "detail-loading" }, ["Couldn't find this lineup."]));
    return;
  }

  const diff = DIFFICULTY_META[detail.difficulty] || DIFFICULTY_META.easy;
  const agentMeta = getAgentMeta(detail.agent);
  body.appendChild(el("div", { class: "detail-header" }, [
    el("div", {}, [
      el("div", { class: "detail-map" }, [detail.map]),
      el("h2", { class: "detail-name" }, [detail.name])
    ]),
    el("div", { class: "detail-tags" }, [
      el("span", { class: "diff-dot", style: `background:${diff.color}` }),
      el("span", { class: "card-diff" }, [diff.label]),
      detail.agent
        ? (agentMeta && agentMeta.icon
          ? el("span", { style: "display:inline-flex;align-items:center;gap:6px;" }, [
              el("img", { src: agentMeta.icon, alt: detail.agent, style: "width:18px;height:18px;border-radius:50%;object-fit:cover;display:block;" }),
              el("span", {}, [detail.agent])
            ])
          : el("span", {}, [detail.agent]))
        : null,
      detail.site ? el("span", {}, ["Site " + detail.site]) : null,
      detail.duration ? el("span", { class: "card-duration" }, [detail.duration]) : null
    ])
  ]));

  const imgGrid = el("div", { class: "detail-grid" }, []);
  const galleryImages = [];
  SLOT_META.forEach(s => {
    const src = detail.images ? detail.images[s.key] : null;
    if (src) galleryImages.push({ src, label: s.label });
    imgGrid.appendChild(el("div", { class: "detail-slot" }, [
      src
        ? el("img", {
            src: imageSourceFromValue(src),
            alt: s.label,
            style: "cursor: pointer;",
            onclick: () => openGallery(galleryImages, galleryImages.findIndex(img => img.src === src))
          })
        : el("div", { class: "detail-slot-empty" }, ["No image"]),
      el("div", { class: "detail-slot-label" }, [s.label])
    ]));
  });
  body.appendChild(imgGrid);

  const delBtn = el("button", { class: "btn btn-danger", onclick: () => armDelete(id, delBtn) }, ["Delete lineup"]);
  body.appendChild(el("div", { class: "detail-actions" }, [delBtn]));
}

function armDelete(id, btn) {
  if (!state.deleteArmed) {
    state.deleteArmed = true;
    btn.textContent = "Click again to confirm";
    btn.classList.add("armed");
    setTimeout(() => {
      if (state.deleteArmed) {
        state.deleteArmed = false;
        btn.textContent = "Delete lineup";
        btn.classList.remove("armed");
      }
    }, 3500);
    return;
  }
  performDelete(id);
}

async function performDelete(id) {
  const ok = await deleteEntry(id);
  if (!ok) {
    showToast("Couldn't delete. Try again.");
    return;
  }
  state.index = state.index.filter(i => i.id !== id);
  closeDetail();
  renderMapTabs();
  renderGrid();
  showToast("Lineup deleted.");
}

function closeDetail() {
  document.getElementById("detailModal").classList.remove("open");
  document.body.classList.remove("modal-open");
}

function openGallery(images, startIndex) {
  state.galleryImages = images.map(img => ({
    ...img,
    displaySrc: imageSourceFromValue(img.src)
  }));
  state.galleryIndex = startIndex || 0;
  updateGalleryDisplay();
  document.getElementById("galleryModal").classList.add("open");
  document.body.classList.add("modal-open");
}

function closeGallery() {
  document.getElementById("galleryModal").classList.remove("open");
  document.body.classList.remove("modal-open");
  state.galleryImages = [];
  state.galleryIndex = 0;
}

function updateGalleryDisplay() {
  if (!state.galleryImages.length) return;
  const img = state.galleryImages[state.galleryIndex];
  document.getElementById("galleryImage").src = img.displaySrc;
  document.getElementById("galleryCounter").textContent = `${state.galleryIndex + 1} / ${state.galleryImages.length}`;
}

function galleryPrev() {
  if (!state.galleryImages.length) return;
  state.galleryIndex = (state.galleryIndex - 1 + state.galleryImages.length) % state.galleryImages.length;
  updateGalleryDisplay();
}

function galleryNext() {
  if (!state.galleryImages.length) return;
  state.galleryIndex = (state.galleryIndex + 1) % state.galleryImages.length;
  updateGalleryDisplay();
}

function wireGalleryEvents() {
  document.getElementById("closeGalleryBtn").addEventListener("click", closeGallery);
  document.getElementById("galleryPrev").addEventListener("click", galleryPrev);
  document.getElementById("galleryNext").addEventListener("click", galleryNext);
  document.getElementById("galleryModal").addEventListener("click", e => {
    if (e.target.id === "galleryModal") closeGallery();
  });
  document.addEventListener("keydown", e => {
    if (!document.getElementById("galleryModal").classList.contains("open")) return;
    if (e.key === "ArrowLeft") { e.preventDefault(); galleryPrev(); }
    else if (e.key === "ArrowRight") { e.preventDefault(); galleryNext(); }
    else if (e.key === "Escape") closeGallery();
  });
}

function armClearAll(btn) {
  if (!state.clearArmed) {
    state.clearArmed = true;
    btn.textContent = "Click again to confirm";
    btn.classList.add("armed");
    setTimeout(() => {
      if (state.clearArmed) {
        state.clearArmed = false;
        btn.textContent = "Clear all data";
        btn.classList.remove("armed");
      }
    }, 3500);
    return;
  }
  clearAll(btn);
}

async function clearAll(btn) {
  btn.disabled = true;
  const ok = await clearEntries();
  btn.disabled = false;
  btn.textContent = "Clear all data";
  btn.classList.remove("armed");
  state.clearArmed = false;

  if (!ok) {
    showToast("Couldn't clear. Try again.");
    return;
  }

  state.index = [];
  renderMapTabs();
  renderGrid();
  showToast("All lineups cleared.");
}

function wireStaticEvents() {
  document.getElementById("addBtn").addEventListener("click", () => openForm(state.activeMap === "All" ? null : state.activeMap));
  document.getElementById("newDraftBtn").addEventListener("click", () => createDraft());
  document.getElementById("lineupForm").addEventListener("submit", submitForm);
  document.getElementById("closeFormBtn").addEventListener("click", closeForm);
  document.getElementById("closeDetailBtn").addEventListener("click", closeDetail);
  document.getElementById("formModal").addEventListener("click", e => { if (e.target.id === "formModal") closeForm(); });
  document.getElementById("detailModal").addEventListener("click", e => { if (e.target.id === "detailModal") closeDetail(); });
  document.getElementById("searchInput").addEventListener("input", e => { state.search = e.target.value; renderGrid(); });
  document.getElementById("siteFilter").addEventListener("change", e => { state.activeSite = e.target.value || "All"; renderGrid(); });
  document.getElementById("clearAllBtn").addEventListener("click", e => armClearAll(e.currentTarget));
  wireGalleryEvents();
  wireFormToDraft();

  document.querySelectorAll(".diff-pill").forEach(btn => {
    btn.addEventListener("click", () => setActiveDifficultyPill(btn.dataset.value));
  });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      closeForm();
      closeDetail();
    }
  });
}

async function init() {
  await loadAgentData();
  buildImageSlots();
  renderAgentMenu("agentFilterMenu", state.activeAgent, "filter");
  renderAgentMenu("agentSelectMenu", state.formAgent, "form");
  bindAgentDropdowns();
  buildFilterOptions();
  updateAgentSelectDisplay();
  wireStaticEvents();
  renderDifficultyChips();
  renderMapTabs();
  renderGrid();

  state.drafts = loadDrafts();
  if (state.drafts.length === 0) {
    createDraft("Quick Sketch");
  } else {
    state.currentDraftId = state.drafts[0].id;
  }
  renderDraftsPanel();

  state.index = await loadIndex();
  state.loading = false;
  renderMapTabs();
  renderGrid();
}

init();

</script>
</body>
</html>
